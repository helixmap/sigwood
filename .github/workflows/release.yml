name: release
run-name: release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

# Serialize each package index so two releases cannot publish there concurrently.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
  cancel-in-progress: false

jobs:
  gate:
    name: require main history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the selected commit to be on main history
        run: |
          if merge_base_error=$(git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>&1); then
            echo "ref $GITHUB_REF_NAME at $GITHUB_SHA is on main history"
            exit 0
          else
            merge_base_status=$?
          fi

          if [ "$merge_base_status" -eq 1 ]; then
            annotation_ref="${GITHUB_REF_NAME//'%'/'%25'}"
            annotation_ref="${annotation_ref//$'\r'/'%0D'}"
            annotation_ref="${annotation_ref//$'\n'/'%0A'}"
            echo "::error::ref $annotation_ref at $GITHUB_SHA is not on main history"
            exit 1
          fi

          printf '%s\n' "$merge_base_error" >&2
          echo "::error::could not determine whether the selected commit is on main history"
          exit "$merge_base_status"

  package:
    name: package distributions
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # OIDC signs the artifact attestation. This job has no release environment;
    # the separately scoped publish job remains the declared index upload path.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Tag matches version (tag push only)
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('sigwood/__init__.py').read_text()).group(1))")"
          echo "tag=$tag version=$ver"
          test "$tag" = "$ver" || { echo "::error::tag v$tag != __version__ $ver"; exit 1; }

      # --force-reinstall ensures a same-version tool already on the runner is
      # downloaded and hash-checked instead of accepted as "already satisfied".
      - name: Install hash-locked build toolchain
        run: >-
          python -m pip install --require-hashes --force-reinstall
          -r .github/requirements/build-toolchain.txt

      - name: Throwaway version for TestPyPI (workflow dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import os, re, pathlib
          run = os.environ["GITHUB_RUN_NUMBER"]
          p = pathlib.Path("sigwood/__init__.py")
          s = p.read_text()
          found = re.findall(r'^__version__ = "([^"]+)"$', s, flags=re.M)
          assert len(found) == 1, f"expected exactly one __version__, found {len(found)}"
          base = found[0]
          assert re.fullmatch(r"\d+\.\d+\.\d+", base), f"source version not a stable X.Y.Z: {base!r}"
          target = f"{base}.dev{run}"
          s2, n = re.subn(r'^__version__ = "[^"]+"$', f'__version__ = "{target}"', s, flags=re.M)
          assert n == 1, f"expected exactly one replacement, made {n}"
          p.write_text(s2)
          got = re.search(r'^__version__ = "([^"]+)"$', p.read_text(), flags=re.M).group(1)
          assert got == target, f"post-edit version {got!r} != {target!r}"
          print("rehearsal version:", got)
          PY

      # --no-isolation makes build use the hash-checked backend above. The
      # default isolated build would resolve build-system.requires again.
      - name: Build and validate distributions
        run: |
          python -m build --no-isolation
          python -m twine check dist/*
          python tools/validate_distribution.py dist
          sha256sum dist/*

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: test (py${{ matrix.python-version }})
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Every leg downloads and fingerprints the same artifact. The suite below
      # tests the checkout; the 3.12 clean-venv smoke tests the wheel.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Show downloaded distribution digests
        run: sha256sum dist/*

      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Fail loudly if recursive extras stop installing dependencies whose tests
      # would otherwise skip and make the full-suite result incomplete.
      - name: Guard gap-closing dependencies
        run: python -c "import botocore.exceptions, splunklib; print('cloudtrail + splunk deps present')"

      - name: Full suite against the checkout
        run: python -m pytest -ra

      - name: Clean-venv wheel smoke
        if: matrix.python-version == '3.12'
        run: |
          WHEEL="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          VENV="$RUNNER_TEMP/smoke"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install "$WHEEL"
          "$VENV/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$VENV/bin/sigwood" --version
          "$VENV/bin/sigwood" --help >/dev/null
          "$VENV/bin/python" -c "import importlib.resources as r; assert (r.files('sigwood') / 'data' / 'config_example.toml').is_file()"

  publish:
    name: publish ${{ github.event_name == 'workflow_dispatch' && 'TestPyPI' || 'PyPI' }}
    needs: [package, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  # The GitHub Release is drafted only after the PyPI upload has succeeded, so the
  # Releases page can never advertise a version PyPI does not carry. It stays a DRAFT:
  # publishing it is the maintainer's step in docs/RELEASING.md, after reading the
  # rendered notes. Tag pushes only; the TestPyPI rehearsal has no tag and no release.
  github-release:
    name: draft GitHub Release
    needs: publish
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The body is the tag's own "## [X.Y.Z] - date" changelog section, heading omitted
      # because the release title carries the version. A missing section fails the job
      # rather than drafting a release with no notes; the upload is unaffected either way.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "] - ") == 1 { copying = 1; next }
            copying && /^## \[/ { exit }
            copying { print }
            END { if (!copying) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" &&
            test -s "$RUNNER_TEMP/notes.md" ||
            { echo "::error::CHANGELOG.md has no '## [$version] - ' section"; exit 1; }
          echo "release notes: $(wc -l < "$RUNNER_TEMP/notes.md") lines"

      # Idempotent: a re-run, or a release a maintainer already created by hand, is left
      # exactly as it is. Never publishes - the --draft flag is the whole point.
      - name: Create the draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,url \
               --jq '"release \(.url) already exists (draft=\(.isDraft)) - leaving it untouched"'; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "sigwood $GITHUB_REF_NAME" --verify-tag --draft \
            --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,url \
            --jq '"drafted \(.url) (draft=\(.isDraft))"'
